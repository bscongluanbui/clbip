# Separate VPS, not the monitored LAN. Build this release before first use:
# docker compose -f docker-compose.watchdog.yml build
# docker compose -f docker-compose.watchdog.yml up -d
name: clbip-watchdog
services:
  watchdog:
    image: "${WATCHDOG_IMAGE:-clbip-watchdog:local}"
    build: .
    user: "10001:10001"
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    stop_grace_period: 20s
    environment:
      APP_ROLE: watchdog
      DATA_DIR: /app/watchdog-data
      WATCHDOG_BIND: "${WATCHDOG_BIND:-127.0.0.1}"
      WATCHDOG_PORT: "${WATCHDOG_PORT:-8088}"
      WATCHDOG_TIMEOUT: "${WATCHDOG_TIMEOUT:-180}"
      WATCHDOG_NODE_NAME: "${WATCHDOG_NODE_NAME:-home-server}"
      WATCHDOG_SHARED_TOKEN_FILE: /run/secrets/watchdog_token
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
    secrets: [watchdog_token, telegram_bot_token, telegram_chat_id]
    volumes: ["watchdog-data:/app/watchdog-data"]
volumes:
  watchdog-data:
secrets:
  watchdog_token: {file: ./secrets/watchdog_token}
  telegram_bot_token: {file: ./secrets/telegram_bot_token}
  telegram_chat_id: {file: ./secrets/telegram_chat_id}
